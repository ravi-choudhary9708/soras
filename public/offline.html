<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soras — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FAF9F6;
      color: #334155;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #64748b;
      max-width: 320px;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    button {
      background: linear-gradient(135deg, #F07C00, #e85d04);
      color: white;
      border: none;
      padding: 0.875rem 2rem;
      border-radius: 1rem;
      font-weight: 700;
      font-size: 0.875rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(240, 124, 0, 0.3);
      transition: transform 0.15s;
    }
    button:active { transform: scale(0.97); }
    .badge {
      margin-top: 2rem;
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #94a3b8;
      background: #f1f5f9;
      padding: 0.375rem 0.75rem;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <img src="/soras.png" alt="Soras" class="icon" />
  <h1>You're Offline</h1>
  <p>It looks like your internet connection dropped. Please check your Wi-Fi or mobile data and try again.</p>
  <button onclick="window.location.reload()">Try Again</button>
  <div class="badge">Soras — Restaurant Management</div>
</body>
</html>
